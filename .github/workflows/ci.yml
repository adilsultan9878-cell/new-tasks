name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests on SQLite and PostgreSQL/RLS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_REDIS_URL: redis://localhost:6379/15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - name: Tests (SQLite)
        run: pytest -q
      - name: Tests (PostgreSQL, least-privileged role, RLS enforced)
        run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      - name: Dependency audit (pip-audit, known vulnerabilities)
        run: pip-audit -r requirements.txt --progress-spinner off
      - name: API fuzzing (Schemathesis, fails on any 5xx)
        run: python scripts/fuzz_api.py --examples 15

  agent:
    name: Local agent (unit + safety tests)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[test]" ruff==0.17.6
      - run: ruff check . && ruff format --check .
      - run: python -m pytest -q
      - run: sentinel-agent --version

  frontend:
    name: Frontend (lint, types, unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Dependency audit (runtime packages)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: n8n signature kit (Node.js, cross-checked with the Python signer)
        run: node --test ../integrations/n8n/sentinel-signature.test.js

  e2e:
    name: End-to-end (Playwright)
    needs: [backend, frontend, agent]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend virtualenv
        working-directory: backend
        run: python -m venv .venv && .venv/bin/pip install -r requirements.txt psutil
      - name: Frontend deps + browser
        working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium
      - name: Playwright
        working-directory: frontend
        run: npx playwright test
        env:
          CI: "true"
