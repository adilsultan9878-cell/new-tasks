[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-x-agent"
version = "0.2.0"
description = "SENTINEL X local security agent: enrollment, approved telemetry and local detections"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["psutil>=5.9"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
sentinel-agent = "sentinel_agent.cli:main"

[tool.setuptools]
packages = ["sentinel_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "S105"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S106"]

[tool.ruff.lint.isort]
known-first-party = ["sentinel_agent"]
