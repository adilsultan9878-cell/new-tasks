[project]
name = "sentinel-x-backend"
version = "0.7.0"
description = "SENTINEL X — AEGIS NEXUS API"
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
    "E501",   # line length is enforced by `ruff format`; long f-strings are left intact
    "S101",   # assert is fine in tests
    "S105",   # false positives on token-type string constants
    "S608",   # f-string SQL only interpolates trusted table names
    "B008",   # FastAPI Depends() in defaults
    "RUF001", "RUF002", "RUF003",  # typographic dashes in docs/strings
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S106", "S311"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
