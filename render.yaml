# Render Blueprint for the API (https://render.com/docs/blueprint-spec).
# The web console is deployed separately to Cloudflare Pages — see docs/DEPLOYMENT.md.
services:
  - type: web
    name: sentinel-x-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore # closest Render region to a Supabase project in ap-south-1 (Mumbai)
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL # runtime role (sentinel_app) — RLS enforced
        sync: false
      - key: MIGRATION_DATABASE_URL # owner role, used only by `alembic upgrade head`
        sync: false
      - key: RUN_MIGRATIONS_ON_START # migrate from your computer (docs/DEPLOYMENT.md); "true" needs MIGRATION_DATABASE_URL
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      # --- Phase 10: accounts, e-mail, monitoring (see docs/GO-LIVE.md) ---
      - key: PUBLIC_APP_URL # the console's https:// address; links in e-mails point here
        sync: false
      - key: EMAIL_BACKEND # smtp to send password-reset, verification and invitation e-mails; disabled = off
        value: disabled
      - key: EMAIL_FROM # e.g. SENTINEL X <alerts@your-domain>
        sync: false
      - key: SMTP_HOST # e.g. smtp-relay.brevo.com / smtp.resend.com
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: REGISTRATION_MODE # open | invite_only | domains
        value: invite_only
      - key: ALLOWED_EMAIL_DOMAINS # for REGISTRATION_MODE=domains, e.g. your-company.com
        sync: false
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "false"
      - key: METRICS_TOKEN # Bearer token for GET /metrics (Prometheus / Grafana Cloud)
        generateValue: true
      - key: REDIS_URL # optional: shared rate limits for several instances (Render Key Value / Upstash); empty = per instance
        sync: false
      - key: AUTOMATION_SIGNING_KEY # master key for webhook signing secrets (Phase 8); never share it
        generateValue: true
      - key: CORS_ORIGINS # e.g. https://sentinel-x.pages.dev
        sync: false
      - key: REFRESH_COOKIE_SECURE
        value: "true"
      - key: REFRESH_COOKIE_SAMESITE
        value: lax
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      # Optional threat-intelligence keys (free tiers). Leave unset to run without them.
      - key: ABUSECH_AUTH_KEY # URLhaus + MalwareBazaar — https://auth.abuse.ch/
        sync: false
      - key: ABUSEIPDB_API_KEY # https://www.abuseipdb.com/register
        sync: false
      - key: VIRUSTOTAL_API_KEY # https://www.virustotal.com/gui/join-us
        sync: false
      - key: NVD_API_KEY # optional, raises NVD rate limits
        sync: false
      - key: DB_POOL_SIZE
        value: "3"
      - key: DB_MAX_OVERFLOW
        value: "2"
