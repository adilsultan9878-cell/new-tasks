# Local full stack: PostgreSQL (with RLS-enforcing app role) + API + web console.
#   docker compose up --build        →  http://localhost:8080
# Development defaults only. Override the passwords via a root .env file for anything shared.
name: sentinel-x

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_password}
      SENTINEL_APP_DB_PASSWORD: ${SENTINEL_APP_DB_PASSWORD:-sentinel_app_dev_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/scripts/postgres/create_app_role.sql:/sql/create_app_role.sql:ro
      - ./docker/postgres/init-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sentinel"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql://sentinel_app:${SENTINEL_APP_DB_PASSWORD:-sentinel_app_dev_password}@db:5432/sentinel
      MIGRATION_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres_dev_password}@db:5432/sentinel
      JWT_SECRET: ${JWT_SECRET:-}
      AUTOMATION_SIGNING_KEY: ${AUTOMATION_SIGNING_KEY:-}
      # Local stack only: lets webhooks reach the n8n container (http://n8n:5678). Keep false in production.
      AUTOMATION_ALLOW_PRIVATE_TARGETS: ${AUTOMATION_ALLOW_PRIVATE_TARGETS:-true}
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
      RUN_MIGRATIONS_ON_START: "true"
      # Only nginx (inside this compose network) sits in front of the API.
      FORWARDED_ALLOW_IPS: "*"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8080:80"

  # Optional local n8n for automation: docker compose --profile automation up -d n8n
  # Open http://localhost:5678, create the owner account, then follow integrations/n8n/README.md.
  n8n:
    image: n8nio/n8n:2.49.6
    profiles: ["automation"]
    environment:
      N8N_HOST: localhost
      N8N_PORT: "5678"
      WEBHOOK_URL: http://n8n:5678/
      GENERIC_TIMEZONE: UTC
      N8N_DIAGNOSTICS_ENABLED: "false"
      NODE_FUNCTION_ALLOW_BUILTIN: crypto # Code nodes may verify SENTINEL X signatures
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped

  # Optional local MQTT broker for sensor boards: docker compose --profile iot up -d mosquitto
  mosquitto:
    image: eclipse-mosquitto:2
    profiles: ["iot"]
    ports:
      - "1883:1883"
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./docker/mosquitto/passwd:/mosquitto/config/passwd:ro
    restart: unless-stopped

volumes:
  pgdata:
  n8n_data:
